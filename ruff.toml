# Les deux scripts tournent sur le python3 de la machine cible, sans dependances.
target-version = "py38"
line-length = 100

[lint]
select = ["E", "W", "F", "B", "SIM", "UP", "C4", "RET", "S", "A", "ARG", "N", "PL", "RUF"]

[lint.per-file-ignores]
# BLE001 n'existe pas ici : le filet attrape-tout de fin de script est
# intentionnel et documente — un widget de barre d'etat ne doit jamais
# afficher de trace d'erreur.
"config/*.py" = ["S110"]
